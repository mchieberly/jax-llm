[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jax-llm"
version = "0.1.0"
description = "A small math language model built from scratch with JAX."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "flax>=0.10.0",
    "jax==0.12.0.1",
    "numpy>=2.0.0",
    "optax>=0.2.4",
    "orbax-checkpoint>=0.11.0",
    "tokenizers>=0.21.0",
]

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pytest>=8.3.0",
    "ruff>=0.11.0",
]

cuda = [
    "jax[cuda13]==0.12.0.1",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["."]
include = ["jax_llm*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[[tool.mypy.overrides]]
module = ["optax", "optax.*", "orbax", "orbax.*"]
ignore_missing_imports = true
